name: Benchmark contribution
description: Propose a reproducible benchmark or a reviewed benchmark result
title: "Benchmark: "
labels:
  - benchmark
body:
  - type: input
    id: benchmark
    attributes:
      label: Benchmark name
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project or tool
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction command or script
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Inputs, metrics, and results
      description: Include units, tolerances, tool version, and environment.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Code or result URL
    validations:
      required: true
